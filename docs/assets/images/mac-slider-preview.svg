<svg width="400" height="180" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" rx="12" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  
  <!-- Continuous Slider -->
  <g transform="translate(40, 50)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1D1D1F">Continuous Slider (65%)</text>
    <!-- Background track -->
    <rect y="6" width="320" height="4" rx="2" fill="#E3E3E8"/>
    <!-- Active track -->
    <rect y="6" width="208" height="4" rx="2" fill="#007AFF"/>
    <!-- Thumb -->
    <circle cx="208" cy="8" r="8" fill="white" filter="drop-shadow(0px 1px 3px rgba(0,0,0,0.25))"/>
  </g>

  <!-- Stepped Slider -->
  <g transform="translate(40, 120)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1D1D1F">Stepped Slider with Ticks</text>
    <rect y="6" width="320" height="4" rx="2" fill="#E3E3E8"/>
    <rect y="6" width="160" height="4" rx="2" fill="#007AFF"/>
    <circle cx="160" cy="8" r="8" fill="white" filter="drop-shadow(0px 1px 3px rgba(0,0,0,0.25))"/>
    
    <!-- Ticks -->
    <line x1="0" y1="14" x2="0" y2="18" stroke="#AEAEB2" stroke-width="1"/>
    <line x1="80" y1="14" x2="80" y2="18" stroke="#AEAEB2" stroke-width="1"/>
    <line x1="160" y1="14" x2="160" y2="18" stroke="#AEAEB2" stroke-width="1"/>
    <line x1="240" y1="14" x2="240" y2="18" stroke="#AEAEB2" stroke-width="1"/>
    <line x1="320" y1="14" x2="320" y2="18" stroke="#AEAEB2" stroke-width="1"/>
  </g>
</svg>
