<svg width="400" height="180" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" rx="12" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  
  <!-- Segmented Control Active First -->
  <g transform="translate(40, 45)">
    <rect width="320" height="28" rx="6" fill="#E3E3E8"/>
    <!-- Active Pill -->
    <rect x="2" y="2" width="104" height="24" rx="5" fill="#FFFFFF" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.12))"/>
    <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1D1D1F" text-anchor="middle">Grid View</text>
    
    <!-- Divider -->
    <line x1="213" y1="6" x2="213" y2="22" stroke="#C7C7CC" stroke-width="1"/>

    <text x="160" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">List View</text>
    <text x="267" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">Column</text>
  </g>

  <!-- Segmented Control Active Second -->
  <g transform="translate(40, 105)">
    <rect width="320" height="28" rx="6" fill="#E3E3E8"/>
    <!-- Active Pill -->
    <rect x="108" y="2" width="104" height="24" rx="5" fill="#FFFFFF" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.12))"/>
    <text x="54" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">Day</text>
    <text x="160" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1D1D1F" text-anchor="middle">Week</text>
    <text x="267" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">Month</text>
  </g>
</svg>
