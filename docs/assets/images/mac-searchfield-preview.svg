<svg width="400" height="180" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" rx="12" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  
  <!-- Inactive Capsule Search -->
  <g transform="translate(60, 45)">
    <rect width="280" height="28" rx="14" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1"/>
    <!-- Search Icon -->
    <circle cx="16" cy="14" r="4.5" stroke="#8E8E93" stroke-width="1.5" fill="none"/>
    <line x1="19.5" y1="17.5" x2="23" y2="21" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8E8E93">Search photos, tags, or places...</text>
  </g>

  <!-- Focused Capsule Search with Clear button -->
  <g transform="translate(60, 105)">
    <!-- Focus ring -->
    <rect x="-1" y="-1" width="282" height="30" rx="15" fill="none" stroke="#007AFF" stroke-width="2" opacity="0.5"/>
    <rect width="280" height="28" rx="14" fill="#FFFFFF" stroke="#007AFF" stroke-width="1"/>
    <!-- Search Icon -->
    <circle cx="16" cy="14" r="4.5" stroke="#007AFF" stroke-width="1.5" fill="none"/>
    <line x1="19.5" y1="17.5" x2="23" y2="21" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#1D1D1F">golden gate sunset</text>
    <!-- Clear circle ✕ -->
    <circle cx="264" cy="14" r="7" fill="#8E8E93"/>
    <path d="M261.5 11.5L266.5 16.5M266.5 11.5L261.5 16.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
