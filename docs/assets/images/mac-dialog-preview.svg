<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" rx="12" fill="#EAEAEF" stroke="#D1D1D6" stroke-width="1"/>

  <!-- Dialog Card -->
  <g transform="translate(60, 25)">
    <rect width="280" height="190" rx="12" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.18))"/>

    <!-- App Icon -->
    <rect x="114" y="20" width="52" height="52" rx="12" fill="url(#blue_grad)"/>
    <text x="140" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle"></text>

    <!-- Title & Body -->
    <text x="140" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="650" fill="#1D1D1F" text-anchor="middle">Do you want to export photos?</text>
    <text x="140" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="400" fill="#86868B" text-anchor="middle">1,248 items will be saved to your disk.</text>

    <!-- Buttons -->
    <rect x="100" y="145" width="75" height="26" rx="6" fill="#F5F5F7" stroke="#D1D1D6" stroke-width="1"/>
    <text x="137.5" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="450" fill="#1D1D1F" text-anchor="middle">Cancel</text>

    <rect x="185" y="145" width="75" height="26" rx="6" fill="#007AFF"/>
    <text x="222.5" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Export</text>
  </g>

  <defs>
    <linearGradient id="blue_grad" x1="140" y1="20" x2="140" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007AFF"/>
      <stop offset="1" stop-color="#0051A8"/>
    </linearGradient>
  </defs>
</svg>
