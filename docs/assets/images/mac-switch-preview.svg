<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" rx="12" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  
  <!-- Regular Switch On -->
  <g transform="translate(40, 40)">
    <rect width="38" height="22" rx="11" fill="#34C759"/>
    <circle cx="27" cy="11" r="9" fill="white" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.2))"/>
    <text x="50" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#1D1D1F">Regular On (38×22)</text>
  </g>

  <!-- Regular Switch Off -->
  <g transform="translate(40, 80)">
    <rect width="38" height="22" rx="11" fill="#E9E9EA" stroke="#D1D1D6" stroke-width="0.5"/>
    <circle cx="11" cy="11" r="9" fill="white" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.15))"/>
    <text x="50" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#1D1D1F">Regular Off</text>
  </g>

  <!-- Mini Switch On -->
  <g transform="translate(40, 120)">
    <rect width="28" height="16" rx="8" fill="#34C759"/>
    <circle cx="20" cy="8" r="6.5" fill="white" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.2))"/>
    <text x="50" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#1D1D1F">Mini On (28×16)</text>
  </g>

  <!-- Disabled Switch -->
  <g transform="translate(40, 155)">
    <rect width="38" height="22" rx="11" fill="#E9E9EA" opacity="0.4"/>
    <circle cx="11" cy="11" r="9" fill="white" opacity="0.6"/>
    <text x="50" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Disabled State</text>
  </g>
</svg>
