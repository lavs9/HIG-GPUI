<svg width="400" height="230" viewBox="0 0 400 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="230" rx="12" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>

  <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#8E8E93" letter-spacing="0.5">GENERAL PREFERENCES</text>

  <!-- Card container -->
  <g transform="translate(30, 42)">
    <rect width="340" height="156" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>

    <!-- Row 1: Wi-Fi -->
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#007AFF"/>
    <text x="28" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">⌥</text>
    <text x="52" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#1D1D1F">Automatic Sync</text>
    <text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#8E8E93">Keep database in sync with cloud</text>
    <!-- Switch -->
    <rect x="288" y="15" width="38" height="22" rx="11" fill="#34C759"/>
    <circle cx="315" cy="26" r="9" fill="white" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.15))"/>

    <line x1="52" y1="52" x2="340" y2="52" stroke="#E5E5EA" stroke-width="1"/>

    <!-- Row 2: Search mode -->
    <rect x="14" y="64" width="28" height="28" rx="6" fill="#34C759"/>
    <text x="28" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">🔍</text>
    <text x="52" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#1D1D1F">Neural Semantic Search</text>
    <text x="52" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#8E8E93">Local embeddings indexing</text>
    <rect x="288" y="67" width="38" height="22" rx="11" fill="#34C759"/>
    <circle cx="315" cy="78" r="9" fill="white" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.15))"/>

    <line x1="52" y1="104" x2="340" y2="104" stroke="#E5E5EA" stroke-width="1"/>

    <!-- Row 3: Cache size -->
    <rect x="14" y="116" width="28" height="28" rx="6" fill="#FF9500"/>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">⚡</text>
    <text x="52" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#1D1D1F">Memory Cache Limit</text>
    <text x="316" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8E8E93" text-anchor="end">4.0 GB ⇕</text>
  </g>
</svg>
